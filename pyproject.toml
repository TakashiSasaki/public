[project]
name = "gag-repo-viewer"
version = "0.2.24"
description = "Git Branch Detector GUI Tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Takashi Sasaki" }
]
dependencies = [
    "pipx>=1.7.1",
]

[project.urls]
Homepage = "https://x.com/TakashiSasaki"

[project.scripts]
gag-repo-viewer = "gag.repo_viewer.detect_gui:main"
gui = "gag.repo_viewer.detect_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gag"]
