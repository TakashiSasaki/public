[project]
name = "mouse-pointer"
version = "0.3.10"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Takashi SASAKI", email = "takashi316@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.1",
    "reportlab>=4.4.10",
    "svglib>=1.6.0",
    "platformdirs",
]

[project.scripts]
mouse-pointer = "mouse_pointer.cli:main"
generate-examples = "mouse_pointer.examples:main"
build-exe = "mouse_pointer.builder:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
