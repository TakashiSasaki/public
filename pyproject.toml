[project]
name = "get-a-grip"
version = "0.1.29"
description = "A directory searching application"
authors = [
    {name = "takas"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "textual (>=1.0.0)",
]

[project.scripts]
get-a-grip = "get_a_grip.cli:main"
gag = "get_a_grip.cli:main"
gag-gui = "get_a_grip.ttk:main"
test = "pytest:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jsonschema (>=4.26.0,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]
