[project]
name = "get-a-grip"
version = "0.1.105"
description = "A directory searching application"
authors = [
    {name = "takas"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "textual (>=1.0.0)",
    "GitPython (>=3.1.44)",
    "pygit2 (>=1.19.1,<2.0.0)",
    "dulwich (>=1.0.0,<2.0.0)",
]

[project.scripts]
get-a-grip = "get_a_grip.cli:main"
gag = "get_a_grip.cli:main"
test = "get_a_grip.test_launcher:main"
find-github-dir = "get_a_grip.tools.git.find_github_dir:main"
find-git-worktree = "get_a_grip.tools.git.find_git_worktree:main"
find-git-repo = "get_a_grip.tools.git.find_git_repo:main"
inspect-dirs = "get_a_grip.tools.inspect_platform_dirs:main"

[project.gui-scripts]
gag-gui = "get_a_grip.ttk:main"

[tool.poe.tasks]
check-purls = { cmd = "python scripts/check_purls.py", help = "Check accessibility of GAG PURLs" }
test = { cmd = "pytest", help = "Run all tests" }
test-consistency = { cmd = "pytest tests/test_filelist_consistency.py", help = "Run consistency tests" }
test-urls = { cmd = "pytest tests/test_url_accessibility.py", help = "Run URL accessibility tests" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Automatically generate reports when running pytest
addopts = "--ignore=tests/test_url_accessibility.py --json-report --json-report-file=reports/tests/latest.json --junit-xml=reports/tests/latest.xml --html=reports/tests/latest.html --self-contained-html --cov=get_a_grip --cov-report=json:reports/coverage/latest.json --cov-report=html:reports/coverage/html --cov-report=term -v"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jsonschema (>=4.26.0,<5.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-json-report (>=1.5.0,<2.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "poethepoet (>=0.40.0,<0.41.0)",
    "rdflib (>=7.5.0,<8.0.0)",
    "pydot (>=4.0.1,<5.0.0)",
    "pyld (>=2.0.4,<3.0.0)",
]
