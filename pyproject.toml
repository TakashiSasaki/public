[project]
name = "llama-cpp-tk"
version = "0.1.37"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Takashi Sasaki", email = "takashi316@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.9.2",
    "py-cpuinfo>=9.0.0",
]

[project.urls]
Homepage = "https://x.com/TakashiSasaki"

[project.scripts]
check-env = "llama_cpp_sse.check_env:main"
check-sse = "llama_cpp_sse.check_sse:main"
cleanup-gpu = "llama_cpp_sse.cleanup_gpu:main"
benchmark = "llama_cpp_sse.benchmark:main"
download-bin = "llama_cpp_sse.download_bin:main"
download-models = "llama_cpp_sse.download_models:main"
test-model = "llama_cpp_sse.test_model:main"
gui = "llama_cpp_sse.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_cpp_sse"]
