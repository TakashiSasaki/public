[project]
name = "my-mdns"
version = "0.1.9"
description = "mDNS capture and forward tool prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Takashi Sasaki" }
]
dependencies = []

[project.urls]
Homepage = "https://x.com/TakashiSasaki"

[project.scripts]
my-mdns = "my_mdns.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_mdns"]
