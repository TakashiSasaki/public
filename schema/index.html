<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Browser | get-a-grip</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Prism.js for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <!-- D3 & Graphviz -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/@hpcc-js/wasm@2.20.0/dist/graphviz.umd.js"></script>
    <script src="https://unpkg.com/d3-graphviz@5.6.0/build/d3-graphviz.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --bg: #030712;
            --sidebar-bg: rgba(17, 24, 39, 0.8);
            --content-bg: rgba(31, 41, 55, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Swiper Style */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .sidebar-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .file-item {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-dim);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .file-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-weight: 600;
            border-left: 3px solid var(--primary);
        }

        /* Main Viewport */
        .viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent);
        }

        .toolbar {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .current-filename {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            overflow: auto;
            display: flex;
            justify-content: center;
        }

        .code-container {
            width: 100%;
            max-width: 1000px;
            background: var(--content-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            position: relative;
        }

        #graph-container {
            width: 100%;
            height: calc(100vh - 120px);
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        /* Graph Controls */
        .graph-controls {
            display: none;
            gap: 1.5rem;
            align-items: center;
        }

        .graph-controls>div {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .graph-controls select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .graph-controls select:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .graph-controls label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        pre {
            margin: 0 !important;
            background: transparent !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.85rem !important;
        }

        /* Loading Animation */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Back to Home */
        .back-btn {
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            margin-top: auto;
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
        }

        .back-btn:hover {
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Schema Browser</h2>
        </div>
        <div id="fileList" class="file-list">
            <!-- Files injected here -->
        </div>
        <a href="../" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6" />
            </svg>
            Back to Home
        </a>
    </div>

    <div class="viewport">
        <div class="toolbar">
            <div id="currentFile" class="current-filename">Select a file to view</div>
            <div id="graphControls" class="graph-controls">
                <div>
                    <label>Engine</label>
                    <select id="engineSelect">
                        <option value="dot">dot (Hierarchical)</option>
                        <option value="neato">neato (Spring)</option>
                        <option value="fdp">fdp (Force)</option>
                        <option value="twopi">twopi (Radial)</option>
                        <option value="circo">circo (Circular)</option>
                    </select>
                </div>
                <div>
                    <label>Layout</label>
                    <select id="directionSelect">
                        <option value="TB">Vertical (TB)</option>
                        <option value="LR">Horizontal (LR)</option>
                        <option value="BT">Bottom-Up (BT)</option>
                        <option value="RL">Right-Left (RL)</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <!-- Actions like copy could go here -->
            </div>
        </div>
        <div class="content-area">
            <div id="loader" class="loader">
                <div class="loader-spinner"></div>
            </div>
            <div class="code-container">
                <div id="graph-container"></div>
                <pre><code id="codeBlock" class="language-json"></code></pre>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script>
        const files = [
            "dirtree.json", "dirtree.jsonld", "example.efu", "example.jsonld",
            "filelist.json", "filelist.jsonld",
            "http_availability.json", "http_availability.jsonld",
            "probe.json", "probe.jsonld",
            "url_availability_report.txt", "uuid", "uuid.jsonld", "vocab", "vocab.jsonld", "vocab.dot"
        ];

        const fileListEl = document.getElementById('fileList');
        const codeBlock = document.getElementById('codeBlock');
        const graphContainer = document.getElementById('graph-container');
        const currentFileLabel = document.getElementById('currentFile');
        const loader = document.getElementById('loader');
        const graphControls = document.getElementById('graphControls');
        const engineSelect = document.getElementById('engineSelect');
        const directionSelect = document.getElementById('directionSelect');

        let currentDotContent = "";

        function renderGraph() {
            if (!currentDotContent) return;

            const engine = engineSelect.value;
            const direction = directionSelect.value;

            // Pre-process DOT: Replace or inject rankdir
            let dotContent = currentDotContent;

            // Minimal cleanup and injection
            dotContent = dotContent.replace(/rankdir\s*=\s*".*?";?\n?\s*/g, '');
            dotContent = dotContent.replace(/ranksep\s*=\s*.*?;?\n?\s*/g, '');
            dotContent = dotContent.replace(/nodesep\s*=\s*.*?;?\n?\s*/g, '');

            const settings = `\n  rankdir="${direction}";\n  ranksep=1.0;\n  nodesep=0.5;\n`;
            dotContent = dotContent.replace(/digraph\s*{/, `digraph {${settings}`);

            d3.select("#graph-container").graphviz()
                .width(graphContainer.offsetWidth)
                .height(graphContainer.offsetHeight)
                .engine(engine)
                .fit(false)
                .zoom(true)
                .renderDot(dotContent);
        }

        engineSelect.onchange = renderGraph;
        directionSelect.onchange = renderGraph;

        function init() {
            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    ${file}
                `;
                item.onclick = () => loadFile(file, item);
                fileListEl.appendChild(item);
            });

            const hash = window.location.hash.substring(1);
            if (hash && files.includes(hash)) {
                const target = Array.from(fileListEl.children).find(el => el.textContent.trim() === hash);
                loadFile(hash, target);
            } else {
                loadFile(files[0], fileListEl.firstChild);
            }
        }

        async function loadFile(filename, element) {
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            currentFileLabel.textContent = filename;
            window.location.hash = filename;

            loader.style.display = 'block';
            codeBlock.textContent = '';
            graphControls.style.display = 'none';

            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('File not found');
                const content = await response.text();

                if (filename.endsWith('.dot')) {
                    codeBlock.parentElement.style.overflow = 'hidden';
                    codeBlock.style.display = 'none';
                    graphContainer.style.display = 'block';
                    graphControls.style.display = 'flex';

                    currentDotContent = content;
                    renderGraph();
                } else {
                    codeBlock.parentElement.style.overflow = 'auto';
                    codeBlock.style.display = 'block';
                    graphContainer.style.display = 'none';
                    currentDotContent = "";

                    let lang = 'json';
                    if (filename.endsWith('.txt')) lang = 'text';
                    if (filename.endsWith('.efu')) lang = 'text';

                    codeBlock.className = `language-${lang}`;
                    codeBlock.textContent = content;
                    Prism.highlightElement(codeBlock);
                }
            } catch (err) {
                codeBlock.style.display = 'block';
                graphContainer.style.display = 'none';
                graphControls.style.display = 'none';
                codeBlock.textContent = `Error loading file: ${err.message}`;
            } finally {
                loader.style.display = 'none';
            }
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash && files.includes(hash)) {
                const target = Array.from(fileListEl.children).find(el => el.textContent.trim() === hash);
                if (target && !target.classList.contains('active')) {
                    loadFile(hash, target);
                }
            }
        });

        async function loadAvailabilityReport() {
            try {
                const response = await fetch('../reports/purl-availability/latest.jsonld');
                if (!response.ok) return;
                const report = await response.json();
                const header = document.querySelector('.sidebar-header');
                const statusDiv = document.createElement('div');
                statusDiv.style.cssText = 'font-size: 0.8rem; margin-top: 0.5rem; color: var(--text-dim); display: flex; align-items: center; gap: 0.5rem;';
                const date = new Date(report.generated_at).toLocaleString();
                const allOk = report.summary.inaccessible === 0;

                statusDiv.innerHTML = `
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${allOk ? '#22c55e' : '#ef4444'}; shadow: 0 0 10px ${allOk ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)'}"></div>
                    <span>Last Checked: ${date}</span>
                `;
                header.appendChild(statusDiv);
            } catch (err) { }
        }

        init();
        loadAvailabilityReport();
    </script>
</body>

</html>
