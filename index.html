<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Static Full-Text Search with Lunr.js</title>
  <!-- Load Lunr.js from CDN -->
  <script src="https://unpkg.com/lunr/lunr.js"></script>
  <!-- Load the pre-built index file -->
  <script src="lunr_index.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    #search-form {
      margin-bottom: 20px;
    }
    #search-input {
      width: 300px;
      padding: 8px;
      font-size: 1em;
    }
    #results {
      margin-top: 20px;
    }
    .result-item {
      margin-bottom: 15px;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    .result-item a {
      font-size: 1.2em;
      text-decoration: none;
      color: #007acc;
    }
    .result-item a:hover {
      text-decoration: underline;
    }
    mark {
      background-color: yellow;
      color: black;
    }
    #loading {
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Static Full-Text Search</h1>
  <!-- Search form -->
  <form id="search-form" role="search">
    <input type="text" id="search-input" placeholder="Enter search term" required aria-label="Search">
    <button type="submit">Search</button>
  </form>
  
  <!-- Results section with ARIA live region -->
  <section id="results" aria-live="polite"></section>

  <script>
    console.log("Script started.");

    // Verify that prebuilt index variables are available.
    if (typeof prebuiltIndexData === "undefined" || typeof prebuiltDocuments === "undefined") {
      console.error("prebuiltIndexData or prebuiltDocuments is not defined. Ensure lunr_index.js is in the same directory.");
    } else {
      console.log("prebuiltIndexData and prebuiltDocuments loaded.");
    }

    // Load the Lunr index.
    var idx;
    try {
      idx = lunr.Index.load(prebuiltIndexData);
      console.log("Lunr index loaded.");
    } catch (e) {
      console.error("Error loading Lunr index:", e);
    }

    /**
     * Simple debounce function.
     * Returns a debounced version of the function that delays invocation until after wait ms have elapsed since the last invocation.
     * @param {Function} func - The function to debounce.
     * @param {number} wait - The debounce delay in milliseconds.
     * @returns {Function} - The debounced function.
     */
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    /**
     * Highlight all occurrences of tokens in the given text.
     * @param {string} text - The text to highlight.
     * @param {Array} tokens - Array of tokens (strings) to highlight.
     * @returns {string} - The text with tokens wrapped in <mark> tags.
     */
    function highlight(text, tokens) {
      tokens.forEach(function(token) {
        var escapedToken = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var regex = new RegExp(escapedToken, 'gi');
        text = text.replace(regex, function(match) {
          return '<mark>' + match + '</mark>';
        });
      });
      return text;
    }

    /**
     * Process query tokens to enable prefix matching.
     * Appends a trailing "*" to each token if not already present.
     * @param {string} query - The raw query.
     * @returns {string} - The modified query with wildcards.
     */
    function processQueryForPrefix(query) {
      var tokens = query.split(/\s+/).filter(Boolean);
      var processedTokens = tokens.map(function(token) {
        return token.endsWith("*") ? token : token + "*";
      });
      return processedTokens.join(" ");
    }

    /**
     * Perform a search on the index and render results with highlighted snippets.
     * @param {string} query - The raw search query.
     */
    function performSearch(query) {
      var resultsSection = document.getElementById("results");
      resultsSection.innerHTML = "<p id='loading'>Searching...</p>";

      var processedQuery = processQueryForPrefix(query);
      var results = idx.search(processedQuery);
      resultsSection.innerHTML = "";

      if (results.length === 0) {
        resultsSection.innerHTML = "<p>No results found.</p>";
        return;
      }

      var queryTokens = query.split(/\s+/).filter(Boolean);
      var ul = document.createElement("ul");
      results.forEach(function(result) {
        var doc = prebuiltDocuments[result.ref];
        var li = document.createElement("li");
        li.className = "result-item";
        var highlightedSummary = highlight(doc.summary, queryTokens);
        li.innerHTML = "<a href='" + doc.url + "'>" + doc.title + "</a><br>" +
                       "<span>" + highlightedSummary + "</span>";
        ul.appendChild(li);
      });
      resultsSection.appendChild(ul);
    }

    // Attach event listener to the search form (on submit).
    document.getElementById("search-form").addEventListener("submit", function(e) {
      e.preventDefault();
      var query = document.getElementById("search-input").value.trim();
      if (query.length > 0) {
        console.log("Searching for:", query);
        performSearch(query);
      }
    });

    // Attach debounced real-time search on keyup.
    document.getElementById("search-input").addEventListener("keyup", debounce(function(e) {
      var query = this.value.trim();
      if (query.length > 2) {
        performSearch(query);
      }
    }, 300));
  </script>
</body>
</html>
